version: 2

updates:
  # Runtime dependencies are one package (typebox). Everything else here is a
  # devDependency, so most of these PRs only affect CI and local development.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      dev-dependencies:
        dependency-type: development

  # CI pins every action by full commit SHA. This is what keeps the pins from
  # rotting: Dependabot bumps the SHA and rewrites the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
