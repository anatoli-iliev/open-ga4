version: 2

updates:
  # There are zero runtime dependencies. Everything npm knows about here is a
  # devDependency, so every one of these PRs affects only CI and local
  # development, never what a user installs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      dev-dependencies:
        dependency-type: development

  # CI pins every action by full commit SHA. This is what keeps the pins from
  # rotting: Dependabot bumps the SHA and rewrites the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
