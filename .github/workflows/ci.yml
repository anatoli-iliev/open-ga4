name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow needs write access, and nothing needs a secret:
# the test suite makes no network calls and uses no credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The skill targets Node >=22.22.3. 22 is the floor, 24 is current.
        node: ['22', '24']

    steps:
      # Actions are pinned by full commit SHA. A tag can be moved; a SHA cannot.
      # Dependabot proposes updates weekly; see .github/dependabot.yml.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `pretest` builds first, because src/privacy/surface.test.ts asserts the
      # privacy guarantees against lib/, the bundle that actually ships.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert lib/ matches a fresh build of src/
        run: |
          set -euo pipefail
          npm run check:lib
          if [ -n "$(git status --porcelain lib/)" ]; then
            echo "::error::lib/ is not a clean build of src/. Run npm run build and commit."
            git --no-pager diff --stat lib/
            exit 1
          fi
          echo "lib/ matches src/"

      - name: Assert lib/ ships no compiled tests
        run: |
          set -euo pipefail
          leaked="$(find lib -type f -name '*.test.js')"
          if [ -n "$leaked" ]; then
            echo "::error::lib/ contains compiled test files:"; echo "$leaked"; exit 1
          fi

# There is deliberately no publish job here. A publish workflow that can fire on
# a push is a foot-gun: one bad merge and a broken listing is on ClawHub forever.
# Releasing, when it lands, runs from its own workflow, gated on
# `on: release: types: [published]`, and runs `clawhub skill publish` with the
# source repository, ref and commit passed explicitly, so the listing records
# which commit produced it. Nothing here fires on a push, and no such workflow
# exists yet.
